<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IP Link</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <img src="logo.png" class="logo" alt="IPLink Logo" />
        <div>
          <h1>IP Link</h1>
          <p class="subtitle">纯 IP 内网穿透客户端</p>
        </div>
      </div>

      <div class="topbar-actions">
        <span id="statusBadge" class="badge badge-disconnected">
          <span class="dot"></span>
          <span id="statusText">未连接</span>
        </span>
        <button id="btnImport" class="btn btn-secondary" title="导入 client.json">导入配置</button>
        <button id="btnExport" class="btn btn-secondary" title="导出 client.json">导出配置</button>
        <button id="btnSave" class="btn btn-secondary" title="保存当前配置">保存</button>
        <button id="btnConnect" class="btn btn-primary">连接</button>
      </div>
    </header>

    <div id="toast" class="toast hidden"></div>

    <!-- 主体两栏 -->
    <main class="grid">
      <!-- 左侧：服务端与安全配置 -->
      <section class="card">
        <div class="card-header">
          <h2>连接配置</h2>
        </div>
        <div class="form-grid">
          <div class="field span-2">
            <label for="serverAddr">服务端 IP（纯 IP 地址）</label>
            <input id="serverAddr" type="text" placeholder="例如 8.134.86.34" />
          </div>
          <div class="field">
            <label for="serverPort">控制端口</label>
            <input id="serverPort" type="number" min="1" max="65535" />
          </div>
          <div class="field">
            <label for="relayPort">中继端口 (UDP)</label>
            <input id="relayPort" type="number" min="1" max="65535" />
          </div>
          <div class="field">
            <label for="natPort">NAT 探测端口 (UDP)</label>
            <input id="natPort" type="number" min="1" max="65535" />
          </div>
          <div class="field">
            <label for="clientId">客户端 ID</label>
            <input id="clientId" type="text" placeholder="windows-client-001" />
          </div>
          <div class="field span-2">
            <label for="token">认证密钥 (Token / ${IPLINK_TOKEN})</label>
            <div class="input-group">
              <input id="token" type="password" placeholder="与服务端一致的密钥或 ${IPLINK_TOKEN}" />
              <button id="btnToggleToken" type="button" class="btn btn-ghost">显示</button>
            </div>
          </div>
          <div class="field span-2">
            <label for="allowedTargets">允许转发的本地目标白名单（逗号分隔）</label>
            <input id="allowedTargets" type="text" placeholder="127.0.0.1:*, 192.168.1.0/24:*" />
          </div>
        </div>

        <div class="toggles">
          <label class="checkbox"><input id="tlsEnabled" type="checkbox" /> 启用 TLS 1.3</label>
          <label class="checkbox"><input id="tlsSkipVerify" type="checkbox" /> 跳过证书校验</label>
          <label class="checkbox"><input id="enableP2P" type="checkbox" /> 启用 P2P</label>
          <label class="checkbox"><input id="reconnectEnabled" type="checkbox" /> 断线自动重连</label>
        </div>
      </section>

      <!-- 右侧：隧道管理 + 本地端口映射 -->
      <div class="right-col">
        <section class="card">
          <div class="card-header">
            <h2>公网隧道列表 (<span id="tunnelCount">0</span>)</h2>
            <button id="btnAddTunnel" class="btn btn-primary btn-sm">+ 添加隧道</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>协议</th>
                  <th>本地地址</th>
                  <th>远端地址 / HTTP 路径</th>
                  <th>运行状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="tunnelBody">
                <tr><td colspan="6" class="empty">暂无隧道，点击右上角「+ 添加隧道」</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2>本地端口映射 (<span id="forwardCount">0</span>) <span class="hint">无需改应用，将本地监听端口转发到目标端口</span></h2>
            <button id="btnAddForward" class="btn btn-primary btn-sm">+ 添加映射</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>本地监听</th>
                  <th>转发目标</th>
                  <th>状态</th>
                  <th>启用</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="forwardBody">
                <tr><td colspan="6" class="empty">暂无本地映射，例如 127.0.0.1:5000 → 127.0.0.1:6000</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <!-- 底部：实时日志 -->
    <section class="card log-card">
      <div class="card-header">
        <h2>运行日志</h2>
        <div class="log-actions">
          <label class="checkbox"><input id="autoScroll" type="checkbox" checked /> 自动滚动</label>
          <button id="btnClearLogs" class="btn btn-secondary btn-sm">清空</button>
        </div>
      </div>
      <div id="logContainer" class="log-box"></div>
    </section>
  </div>

  <!-- 添加 / 编辑隧道弹窗 -->
  <div id="tunnelModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">添加隧道</h3>
        <button id="btnCloseModal" class="btn btn-ghost">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="tName">隧道名称</label>
          <input id="tName" type="text" placeholder="例如 ollama" />
        </div>
        <div class="field">
          <label for="tProto">协议</label>
          <select id="tProto">
            <option value="tcp">TCP</option>
            <option value="udp">UDP</option>
            <option value="http">HTTP 反向代理</option>
          </select>
        </div>
        <div class="field">
          <label for="tLocal">本地服务地址 (local_addr)</label>
          <input id="tLocal" type="text" placeholder="例如 127.0.0.1:11434" />
        </div>
        <div id="remoteGroup" class="field">
          <label for="tRemote">服务端监听地址 (remote_addr)</label>
          <input id="tRemote" type="text" placeholder="例如 0.0.0.0:11434" />
        </div>
        <div id="httpGroup" class="hidden">
          <div class="field">
            <label for="tHttpPath">HTTP 路径前缀 (http_path)</label>
            <input id="tHttpPath" type="text" placeholder="例如 /app1" />
          </div>
          <label class="checkbox"><input id="tStripPrefix" type="checkbox" checked /> 转发时剥离前缀 (strip_prefix)</label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnCancelModal" class="btn btn-secondary">取消</button>
        <button id="btnSaveTunnel" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 添加 / 编辑本地端口映射弹窗 -->
  <div id="forwardModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="fModalTitle">添加本地端口映射</h3>
        <button id="btnCloseFModal" class="btn btn-ghost">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="fName">映射名称</label>
          <input id="fName" type="text" placeholder="例如 local-5000-to-6000" />
        </div>
        <div class="field">
          <label for="fListen">本地监听地址 (应用访问的地址)</label>
          <input id="fListen" type="text" placeholder="例如 127.0.0.1:5000" />
        </div>
        <div class="field">
          <label for="fTarget">转发目标地址 (实际服务的地址)</label>
          <input id="fTarget" type="text" placeholder="例如 127.0.0.1:6000" />
        </div>
        <label class="checkbox"><input id="fEnabled" type="checkbox" checked /> 立即启用</label>
      </div>
      <div class="modal-footer">
        <button id="btnCancelFModal" class="btn btn-secondary">取消</button>
        <button id="btnSaveForward" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 首次运行引导 -->
  <div id="setupWizard" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog wizard-dialog">
      <div class="modal-header">
        <h3>欢迎使用 IP Link — 快速设置</h3>
      </div>
      <div class="modal-body">
        <p class="wizard-intro">首次运行需要填写服务端信息。之后可在主界面随时修改。</p>
        <div class="field">
          <label for="wServerAddr">服务端 IP（纯 IP 地址）</label>
          <input id="wServerAddr" type="text" placeholder="例如 8.134.86.34" />
        </div>
        <div class="field-grid-2">
          <div class="field">
            <label for="wServerPort">控制端口</label>
            <input id="wServerPort" type="number" min="1" max="65535" value="29000" />
          </div>
          <div class="field">
            <label for="wClientId">客户端 ID</label>
            <input id="wClientId" type="text" value="windows-client-001" />
          </div>
        </div>
        <div class="field">
          <label for="wToken">认证密钥 (Token)</label>
          <input id="wToken" type="password" placeholder="与服务端一致的密钥" />
        </div>
        <div class="field">
          <label for="wAllowedTargets">允许转发的本地目标白名单（逗号分隔）</label>
          <input id="wAllowedTargets" type="text" value="127.0.0.1:*" />
        </div>
        <p id="wError" class="wizard-error hidden"></p>
      </div>
      <div class="modal-footer">
        <button id="btnWizardSkip" class="btn btn-secondary">稍后设置</button>
        <button id="btnWizardFinish" class="btn btn-primary">保存并继续</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
